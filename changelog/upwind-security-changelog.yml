entries:
  - component: upwindctl
    version: 0.30.0
    highlights:
      - New `gcp onboarding preflight` command validating Google Cloud org readiness for org-level onboarding (read-only)
      - RBAC-only flag added to the Azure preflight command for SaaS onboarding
      - New `tool update` and `tool uninstall` subcommands
      - Host install script now supports non-interactive installs
      - Container images published for multiple platforms including Windows
      - Dependency bump to golang.org/x/net v0.55.0 addressing GO-2026-5026
