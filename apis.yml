aid: upwind-security
name: Upwind Security
description: >-
  Upwind is a cloud security (CNAPP) platform that pairs cloud security
  posture with eBPF-based runtime protection across AWS, Azure, Google
  Cloud, and Oracle Cloud, spanning vulnerability management, threat
  detection, configuration and compliance, API security, identity
  security, and shift-left CI/CD scanning. Its Management REST API (v1
  and v2) exposes threats, vulnerabilities, configurations, inventory,
  SBOM packages, workflows, and access management using OAuth 2.0 client
  credentials, and the company ships a hosted MCP server plus an official
  Agent Skill for AI coding assistants.
