        high_count:
          type: integer
          format: int32
          description: Number of high severity vulnerabilities
        low_count:
          type: integer
          format: int32
          description: Number of low severity vulnerabilities
        medium_count:
          type: integer
          format: int32
          description: Number of medium severity vulnerabilities
        total_count:
          type: integer
          format: int32
          description: Total number of vulnerabilities
        unclassified_count:
          type: integer
          format: int32
          description: Number of unclassified severity vulnerabilities
    ApiHighPrivilegedRiskData:
      type: object
      description: Elevated-privilege access risk information for an asset
      properties:
        has_elevated_privilege:
          type: boolean
          description: Indicates whether the asset has elevated or high-level privileges that could increase its security risk.
    ApiPaginationMetadata:
      type: object
      description: Pagination metadata for navigating through result pages
      properties:
        limit:
          type: integer
          format: int32
          description: The maximum number of items returned per page
          example: 20
        next_cursor:
          type: string
          description: Cursor for fetching the next page of results. Absent if there are no more pages.
          example: eyJvZmZzZXQiOjIwfQ
        previous_cursor:
          type: string
          description: Cursor for fetching the previous page of results. Absent if this is the first page.
          example: eyJvZmZzZXQiOjB9
