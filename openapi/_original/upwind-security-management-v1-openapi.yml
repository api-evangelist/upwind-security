  /v1/organizations/{organization-id}/configuration-findings:
    get:
      description: "A `GET` request sent to the endpoint root returns a list of Configuration\
        \ Finding objects that are associated with the specified organization. This\
        \ endpoint allows you to search and filter configuration findings based on\
        \ various criteria such as status, severity, resource name, and framework.\
        \ By default, only findings with `FAIL` status are returned unless otherwise\
        \ specified. To learn more about Configurations, refer to the [Configurations\
        \ Overview](/configurations/overview) page."
      x-order:
        value: "1"
      operationId: getComplianceResourceFindings
      parameters:
      - $ref: "#/components/parameters/organization-id"
      - deprecated: true
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
      - description: Specifies how many results are returned on a page.
        in: query
        name: per-page
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      - description: Specifies the token for fetching subsequent pages in a paginated
          result set. Use the token from a previous response to continue retrieving
          data when the number of results exceeds the current page size.
        in: query
        name: page-token
        required: false
        schema:
          type: string
      - description: Filters findings by the earliest timestamp (in ISO8601 format)
          when they were last seen.
        in: query
        name: min-last-seen-time
        required: false
        schema:
          type: string
      - description: Filters findings by the latest timestamp (in ISO8601 format)
          when they were last seen.
        in: query
        name: max-last-seen-time
        required: false
        schema:
          type: string
      - description: Filters findings by their status. Defaults to `FAIL` when not
          specified.
        in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - PASS
          - FAIL
          - ALL
      - description: "Filters findings by their severity level. Multiple values may\
          \ be provided, separated by commas."
        example: "LOW,HIGH"
        in: query
        name: severity
        required: false
        schema:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
      - description: Filters findings by their Upwind asset ID.
        in: query
        name: upwind-asset-id
        required: false
        schema:
          type: string
      - description: Filters findings by the specified resource name.
        in: query
        name: resource-name
        required: false
        schema:
          type: string
      - description: Filters findings by the specified check title.
        in: query
        name: check-title
        required: false
        schema:
          type: string
      - description: Filters findings by the specified check ID.
        in: query
        name: check-id
        required: false
        schema:
          type: string
