components:
  parameters:
    organization-id:
      description: The unique identifier for the Upwind organization.
      example: org_Xk9mPq7RtYwN2vLs
      in: path
      name: organization-id
      required: true
      schema:
        type: string
  schemas:
    ApiEndpoint:
      type: object
      properties:
        domains:
          type: array
          description: List of domains associated with this endpoint.
          items:
            type: string
          uniqueItems: true
        first_seen_time:
          type: string
          format: date-time
          description: The timestamp when this endpoint was first observed.
        id:
          type: string
          description: The unique identifier for this endpoint.
        last_seen_time:
          type: string
          format: date-time
          description: The timestamp when this endpoint was last observed.
        method:
          type: string
          description: The HTTP method for this endpoint.
          enum:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - HEAD
          - OPTIONS
          - TRACE
        resource_id:
          type: string
          description: The unique identifier of the associated resource.
        risk_overview:
          $ref: "#/components/schemas/ApiEndpointRiskOverview"
          description: Risk assessment overview for this endpoint.
        status_codes:
          type: array
          description: List of HTTP status codes observed for this endpoint.
          items:
            type: string
          uniqueItems: true
        uri:
          type: string
          description: The URI path for this endpoint.
    ApiEndpointAuthentication:
      type: object
      properties:
        state:
          type: string
          description: The authentication state of this endpoint.
          enum:
          - AUTHENTICATED
          - UNAUTHENTICATED
          - UNKNOWN
    ApiEndpointExposureDetails:
      type: object
      properties:
        last_seen_time:
          type: string
          format: date-time
          description: The timestamp when this exposure was last observed.
    ApiEndpointInternetExposure:
      type: object
      properties:
        ingress:
          $ref: "#/components/schemas/ApiEndpointExposureDetails"
          description: Ingress exposure details for this endpoint.
    ApiEndpointRiskOverview:
      type: object
      properties:
        authentication:
          $ref: "#/components/schemas/ApiEndpointAuthentication"
          description: Authentication details for this endpoint.
        internet_exposure:
          $ref: "#/components/schemas/ApiEndpointInternetExposure"
          description: Internet exposure details for this endpoint.
        sensitive_data_findings:
          type: array
          description: List of sensitive data findings associated with this endpoint.
          items:
            $ref: "#/components/schemas/ApiEndpointSensitiveDataFinding"
    ApiEndpointSensitiveDataFinding:
      type: object
      properties:
        category:
          type: string
          description: The category of sensitive data finding.
        last_seen_time:
          type: string
          format: date-time
          description: The timestamp when this sensitive data finding was last observed.
        type:
          type: string
          description: The type of sensitive data finding.
    ApiExploitableFunctionInUse:
      type: object
      properties:
        container_id:
          type: string
          description: The identifier of the container in which the exploitable function
            is running.
        container_name:
          type: string
          description: The name of the container in which the exploitable function
            is running.
        file_path:
          type: string
          description: The file path where the exploitable function is located.
        function_name:
          type: string
          description: The name of the exploitable function.
        last_detection_time:
          type: string
          format: date-time
          description: The timestamp when this exploitable function was last detected
            in use (in ISO8601 format).
        origin_library_id:
          type: string
          description: The identifier of the library where this in-use function was
            detected.
          example: com.example.security:crypto-utils
        process_id:
          type: string
          description: The identifier of the process executing the exploitable function.
        process_name:
          type: string
          description: The name of the process executing the exploitable function.
    ApiKeyAuthentication:
      allOf:
      - $ref: "#/components/schemas/Authentication"
      - type: object
        properties:
          key:
            type: string
          value:
            type: string
    ApiLayerInfo:
      type: object
      properties:
        layer_index:
          type: integer
          format: int32
          description: The index of the layer within the image.
        layer_sha:
          type: string
          description: The SHA digest of the layer.
    ApiPaginationMetadata:
      type: object
      description: Pagination metadata for navigating through result pages
      properties:
        limit:
          type: integer
          format: int32
          description: The maximum number of items returned per page
          example: 20
        next_cursor:
          type: string
          description: Cursor for fetching the next page of results. Absent if there
            are no more pages.
          example: eyJvZmZzZXQiOjIwfQ
        previous_cursor:
          type: string
          description: Cursor for fetching the previous page of results. Absent if
            this is the first page.
          example: eyJvZmZzZXQiOjB9
    ApiUpdateCloudAccountRequest:
      type: object
      properties:
        config:
          $ref: "#/components/schemas/CloudAccountConfigBYOC"
    AuditLogData:
      type: object
      properties:
        initiator:
          $ref: "#/components/schemas/Initiator"
    AuditLogSummary:
      allOf:
      - $ref: "#/components/schemas/EventSummary"
      - type: object
        properties:
          data:
            $ref: "#/components/schemas/AuditLogData"
    Authentication:
      type: object
      discriminator:
        propertyName: type
      properties:
        type:
          type: string
          enum:
          - BEARER
          - API_KEY
    AwsCloudtrailSummary:
      allOf:
      - $ref: "#/components/schemas/EventSummary"
      - type: object
        properties:
          endpointId:
            type: string
          initiator:
            $ref: "#/components/schemas/DetectionAwsCloudtrailInitiatorDetails"
          rawLog:
            type: string
    BadReputationIpsData:
      type: object
      properties:
        abuse_rate:
          type: string
        city:
          type: string
        country:
          type: string
        direction:
          type: string
        domain:
          type: string
    BadReputationIpsDataList:
      type: object
      properties:
        bad_reputation_ips:
          type: array
          items:
            $ref: "#/components/schemas/BadReputationIpsData"
    BaseScheduledJobConfig:
