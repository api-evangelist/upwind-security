- description: |
    ## Overview

    The Agentless Kubernetes resource provides methods for configuring and operating agentless scanning of Kubernetes clusters across your cloud infrastructure. Agentless scanning inspects clusters without deploying a sensor inside the cluster, enabling security coverage for environments where in-cluster agent deployment is not feasible.

    ## Scope hierarchy and settings inheritance

    Agentless Kubernetes configuration is organized in a five-level scope hierarchy: **cloud provider** → **tenant** → **organizational unit** → **account** → **cluster**. Settings defined at a higher level in the hierarchy are automatically inherited by all scopes below it, allowing you to establish organization-wide defaults while still overriding specific settings for individual accounts or clusters when needed.

    Every route in this resource is scoped by `{cloud-provider}` (currently `aws`), reflecting the cloud environment in which the target clusters reside.

    ## Settings

    Settings control how agentless scanning is configured at each level of the scope hierarchy. These include enabling or disabling agentless scanning for a scope, the access method used to reach cluster resources, and the authentication method applied when connecting to the cluster API. Changes to settings take effect for subsequent resource-sync cycles and are inherited by child scopes unless explicitly overridden.

    ### Settings reference

    The provider, tenant, organizational-unit, and account levels each carry the settings below; clusters carry the cluster-level equivalents. Unless noted, a value of `inherit` defers to the level above.

    #### `enabled_status`

    **Kill switch.** When set to `disabled` at any level, agentless scanning is forced off for that level and everything beneath it, and no lower level can override it back on. Allowed values: `enabled`, `disabled`, `inherit` (not available at the provider level, which is the root). At the cluster level this is the cluster's own on/off state — it overrides the inherited `cluster_default_enabled_status`, but a `disabled` kill switch on any ancestor still forces the cluster off.

    #### `cluster_default_enabled_status`

    The default enabled state inherited by the clusters beneath a level. Unlike `enabled_status`, it is **overridable**: any lower level — down to an individual cluster's own `enabled_status` — can change it. Use this (rather than `enabled_status`) when you want a default that teams can still opt in or out of. Allowed values: `enabled`, `disabled`, `inherit`.

    #### `cluster_access_method`

    How the scanner reaches a cluster. Set the inherited default at the provider/tenant/OU/account levels with `cluster_default_access_method`, or set it on an individual cluster with `cluster_access_method`. Allowed values:

    - `internet` — reach the cluster's API endpoint over the public internet.
    - `ssm` — reach the cluster privately through AWS Systems Manager.
    - `inherit` — defer to the level above.

    #### `cluster_auth_method`

    How the scanner authenticates to a cluster. Set the inherited default at parent levels with `cluster_default_auth_method`, or set it on an individual cluster with `cluster_auth_method`. Allowed values:

    - `eks_access_entry` — authenticate using an EKS access entry that Upwind provisions.
    - `pre_provisioned` — use cluster access you have set up yourself; suitable when you have provisioned the EKS access entry yourself, or when using older mechanisms like config maps.
    - `inherit` — defer to the level above.

    ## Operations

    In addition to configuration, the Agentless Kubernetes resource exposes operational endpoints for monitoring status and triggering resource syncs. These include retrieving the current status for individual clusters, initiating on-demand resource syncs (for a single cluster or across all clusters in an account), and running connectivity probes to verify that Upwind can reach a cluster.

    ## Onboarding journey: a worked example

    This walkthrough onboards an organization with a non-trivial configuration. Every route is scoped by `{cloud-provider}`; here it is always `aws`.

    ### 1. Turn agentless scanning on for the whole organization

    Configure the provider — the top level — with organization-wide defaults:

    ```
    PATCH /v2/organizations/{organization-id}/agentless/kubernetes/settings/aws/provider
    {
      "enabled_status": "enabled",
      "cluster_default_enabled_status": "enabled",
      "cluster_default_access_method": "internet",
      "cluster_default_auth_method": "eks_access_entry"
    }
    ```

    Every tenant, organizational unit, account, and cluster beneath the provider now inherits these defaults: new clusters come online enabled, reached over the internet and authenticated with EKS access entries.

    ### 2. Soft opt-out for one sensitive account

    A finance account (`123456789012`) should default to *off*, but its team must still be able to re-enable individual clusters later. Set the **default**, not the kill switch:

    ```
    PATCH /v2/organizations/{organization-id}/agentless/kubernetes/settings/aws/accounts/123456789012
    {
      "cluster_default_enabled_status": "disabled"
    }
    ```

    Clusters in this account now default to disabled — but because this is the overridable default, a lower level can still turn one back on.

    ### 3. Re-enable a single cluster in that account

    One cluster (`aws::123456789012::us-east-1::eks-prod`) does need scanning, reached privately over SSM rather than the internet:

    ```
    PATCH /v2/organizations/{organization-id}/agentless/kubernetes/settings/aws/clusters/aws::123456789012::us-east-1::eks-prod
    {
      "enabled_status": "enabled",
      "cluster_access_method": "ssm"
    }
    ```

    The cluster's own `enabled_status` overrides the account's disabled default. Its access method becomes `ssm`; the auth method is left untouched, so it keeps inheriting `eks_access_entry` from the provider.

    ### 4. Hard-disable an entire branch (the kill switch)

    A sandbox organizational unit (`ou-sandbox`) must never be scanned, with no exceptions. Use `enabled_status` — the kill switch:

    ```
    PATCH /v2/organizations/{organization-id}/agentless/kubernetes/settings/aws/organizational-units/ou-sandbox
    {
      "enabled_status": "disabled"
    }
    ```

    Every account and cluster beneath `ou-sandbox` is now forced off, and **no lower-level override can turn it back on** — unlike step 2, where the default left room for the per-cluster override in step 3.

    ### 5. See how an effective value resolves

    Read back the cluster's configuration to understand where each effective value comes from:

    ```
    POST /v2/organizations/{organization-id}/agentless/kubernetes/settings/aws/clusters/search
    { "conditions": [ { "field": "cluster_id", "operator": "eq", "value": "aws::123456789012::us-east-1::eks-prod" } ] }
    ```

    Each setting is returned as a value plus the level it resolved from:

    ```
    "enabled_status":        { "value": "enabled",          "source": "cluster",  "source_id": "aws::123456789012::us-east-1::eks-prod" }
    "cluster_access_method": { "value": "ssm",              "source": "cluster",  "source_id": "aws::123456789012::us-east-1::eks-prod" }
    "cluster_auth_method":   { "value": "eks_access_entry", "source": "provider", "source_id": "aws" }
    ```

    `source` tells you which level supplied each value — here, access and enabled state came from the cluster override, while the auth method is still inherited from the provider.

    ### 6. Operate

    Once configured, drive and monitor resource syncs:

    - **Sync one cluster:** `POST .../agentless/kubernetes/clusters/aws/aws::123456789012::us-east-1::eks-prod/sync` (optional `resource_kinds` body; omit it to sync all kinds).
    - **Sync a whole account:** `POST .../agentless/kubernetes/accounts/aws/123456789012/sync`
    - **Check status:** `GET .../agentless/kubernetes/clusters/aws/aws::123456789012::us-east-1::eks-prod/status`
    - **Verify reachability:** `POST .../agentless/kubernetes/clusters/aws/aws::123456789012::us-east-1::eks-prod/connectivity-probes`
