components:
  parameters:
    organization-id:
      description: The unique identifier for the Upwind organization.
      example: org_Xk9mPq7RtYwN2vLs
      in: path
      name: organization-id
      required: true
      schema:
        type: string
  schemas:
    ApiAddMemberPermission:
      type: object
      description: "A permission binding for adding a member, associating a scope\
        \ with role IDs"
      properties:
        role_ids:
          type: array
          description: List of role IDs to assign for this scope
          items:
            type: string
          minItems: 1
        scope_id:
          type: string
          description: Scope identifier
          example: scope-prod-123
          minLength: 1
      required:
      - role_ids
      - scope_id
    ApiAddMemberRequest:
      type: object
      description: Request to add (invite) a new member to the organization
      properties:
        connection_type:
          type: string
          description: Connection type for authentication
          enum:
          - social-google
          - social-microsoft
          - otp
          - saml
          example: social-google
          minLength: 1
        email:
          type: string
          description: Email of the member to invite
          example: user@example.com
          minLength: 1
        first_name:
          type: string
          description: First name of the member
          example: John
        group_ids:
          type: array
          description: Group IDs to add the member to
          items:
            type: string
        last_name:
          type: string
          description: Last name of the member
          example: Doe
        permissions:
          type: array
          description: Permission bindings to assign to the member
          items:
            $ref: "#/components/schemas/ApiAddMemberPermission"
      required:
      - connection_type
      - email
    ApiAddMemberResponse:
      type: object
      description: Response containing details of the invited member
      properties:
        email:
          type: string
          description: Email of the invited member
          example: user@example.com
    ApiAssetExampleResponse:
      type: object
      description: An Asset example
      example:
        items:
        - name: bucket-name
          refId: 12345::bucket-name
          isPublic: false
          location: us-west-2
          awsEntity:
            acl:
              owner:
                id: a4f1af817628f43b3c846ecbf5339c8d373dd478c6ffd56b9683c2bf2b7329b2
                displayName: acl-name
              grants:
              - grantee:
                  identifier: a4f1af817628f43b3c846ecbf5339c8d373dd478c6ffd56b9683c2bf2b7329b2
                  typeIdentifier: id
                permission:
                  headerName: x-amz-grant-full-control
                  permissionString: FullControl
            tags:
            - key: key
              value: value
            policy:
              policyText: policy-text
            versioning:
              status: "Off"
            loggingConfiguration: {}
            publicAccessBlockConfiguration:
              blockPublicAcls: true
              ignorePublicAcls: true
