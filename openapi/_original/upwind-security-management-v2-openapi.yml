paths:
  /v2/organizations/{organization-id}/access-management/groups/search:
    post:
      description: A POST request sent to the endpoint root's search path returns
        a paginated list of access-management groups matching the specified filter
        conditions.
      operationId: searchGroups
      parameters:
      - $ref: "#/components/parameters/organization-id"
      - description: Specifies the maximum number of items to be returned.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 100
          minimum: 1
      - description: A cursor for pagination to retrieve the next set of results.
        example: eyJvZmZzZXQiOjIwfQ
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: "Sort results by one or more fields. Format: `field` or `field:asc`\
          \ or `field:desc`. Multiple fields: `field1,field2:desc`. Allowed fields:\
          \ `name`, `create_time`. Default: `create_time:asc`."
        example: create_time:asc
        in: query
        name: sort
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Search request body.
              properties:
                conditions:
                  type: array
                  description: List of filter conditions to apply to the search
                  items:
                    type: object
                    description: A filter condition for search queries
                    properties:
                      field:
                        type: string
                        description: The field name to filter on.
                        enum:
                        - id
                        - name
                        - permissions_scope_id
                        - permissions_scope_name
                        - permissions_role_id
                        - permissions_role_name
                        - identity_provider_name
                        - create_time
                        example: name
                      operator:
                        type: string
                        description: The comparison operator to apply.
                        enum:
                        - eq
                        - in
                        - gt
                        - lt
                        example: eq
                      value:
                        type: array
                        description: The values to compare against.
                        example:
                        - Admins
                        items: {}
                    required:
                    - operator
                    - value
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiPaginatedResponseApiGroup"
          description: OK
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "429":
          description: Rate Limit Exceeded
      summary: Search groups
      tags:
      - access-management
  /v2/organizations/{organization-id}/access-management/groups/{group-id}:
    get:
      description: A GET request sent to the endpoint root followed by a unique identifier
        returns detailed information about a specific access-management group.
      operationId: getGroup
      parameters:
      - $ref: "#/components/parameters/organization-id"
      - description: The unique identifier for the group.
        in: path
        name: group-id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiResponseApiGroup"
          description: OK
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found
        "429":
          description: Rate Limit Exceeded
      summary: Get a group
      tags:
      - access-management
    patch:
      description: A PATCH request sent to the endpoint root followed by a unique
        identifier updates the properties of a specific access-management group.
      operationId: updateGroup
      parameters:
      - $ref: "#/components/parameters/organization-id"
      - description: The unique identifier for the group.
        in: path
        name: group-id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiUpdateAccessManagementGroupRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiResponseApiGroup"
          description: OK
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found
        "429":
          description: Rate Limit Exceeded
      summary: Update a group
      tags:
      - access-management
  /v2/organizations/{organization-id}/access-management/groups/{group-id}/members/bulk:
    post:
      description: A POST request adds the specified members to an access-management
        group.
      operationId: addGroupMembers
      parameters:
      - $ref: "#/components/parameters/organization-id"
      - description: The unique identifier for the group.
        in: path
        name: group-id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiBulkGroupMembersRequest"
        required: true
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found
        "429":
          description: Rate Limit Exceeded
      summary: Add members to a group
      tags:
      - access-management
    delete:
      description: A DELETE request removes the specified members from an access-management
        group.
      operationId: removeGroupMembers
      parameters:
      - $ref: "#/components/parameters/organization-id"
      - description: The unique identifier for the group.
        in: path
        name: group-id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiBulkGroupMembersRequest"
        required: true
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found
        "429":
          description: Rate Limit Exceeded
      summary: Remove members from a group
      tags:
      - access-management
  /v2/organizations/{organization-id}/access-management/members:
    post:
      description: A POST request sent to the endpoint root invites a new member to
        the organization with optional permissions and group assignments.
      operationId: addMember
      parameters:
      - $ref: "#/components/parameters/organization-id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiAddMemberRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiResponseApiAddMemberResponse"
          description: OK
        "401":
