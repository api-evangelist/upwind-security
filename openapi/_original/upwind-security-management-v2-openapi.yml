    UpdateComplianceCustomRuleRequestV2:
      type: object
      description: Request body for updating a configuration rule. All fields are
        optional; only the supplied fields are updated.
      properties:
        asset_kind:
          type: string
          description: The updated primary resource type to evaluate.
        category:
          type: string
          description: The updated category for the configuration rule.
        description:
          type: string
          description: The updated description for the configuration rule.
        rego_policy:
          type: string
          description: The updated Rego policy logic for the configuration rule.
          maxLength: 50000
          minLength: 0
        risk_category:
          type: string
          description: The updated risk category for the configuration rule.
        severity:
          type: string
          description: The updated severity level for the configuration rule.
          enum:
          - low
          - medium
          - high
          - critical
        title:
          type: string
          description: The updated title for the configuration rule.
    UpdateFrameworkRequest:
      type: object
      description: Request body for updating a configuration framework.
      properties:
        description:
          type: string
          description: The detailed description of the framework.
        is_enabled:
          type: boolean
          description: Whether the framework is enabled.
          example: true
        title:
          type: string
          description: The title of the framework.
