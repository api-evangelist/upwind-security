  /v2/organizations/{organization-id}/inventory/catalog/assets/search:
    post:
      description: |-
        A `POST` request sent to the search endpoint retrieves a comprehensive list of assets based on the direct attributes described below. It is purpose-built for high-volume inventory queries, allowing you to filter the catalog by specific properties, tags, or security posture.

        **When to Use This API**

        Use this endpoint for flat searches where the filtering criteria are contained within the asset itself. This is the ideal tool for:
        - **Bulk Data Retrieval**: Generating large lists of resources across the entire environment.
        - **Attribute Filtering**: Narrowing down assets by status, type, etc.
        - **Risk Assessment**: Identifying assets based on specific vulnerability severity levels.
      x-order:
        value: "1"
      operationId: searchAssets
      parameters:
      - $ref: "#/components/parameters/organization-id"
      - description: Specifies the maximum number of items to be returned.
        in: query
