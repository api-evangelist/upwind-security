            schema:
              $ref: '#/components/schemas/ThreatPolicyUpdateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatPolicy'
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
