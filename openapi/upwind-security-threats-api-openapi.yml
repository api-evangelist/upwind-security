components:
  schemas:
    ApiCreateRuleDefinitionsRequest:
      type: object
      description: A bulk threat rule definition create request object.
      properties:
        rule_definitions:
          type: array
          description: The list of rule definitions to create.
          items:
            $ref: '#/components/schemas/ApiCreateRuleDefinition'
          maxItems: 100
          minItems: 1
      required:
      - rule_definitions
    EventSummary:
      type: object
      description: Base schema for threat events
      discriminator:
        mapping:
          AUDIT_LOG_EVENT: '#/components/schemas/AuditLogSummary'
          AWS_CLOUDTRAIL_EVENT: '#/components/schemas/AwsCloudtrailSummary'
          MALICIOUS_FILE_ACTIVITY: '#/components/schemas/FileSummary'
          NETWORK_ACTIVITY: '#/components/schemas/NetworkActivitySummary'
          PROCESS_EXECUTION: '#/components/schemas/ProcessExecutionSummary'
        propertyName: type
      properties:
        description:
          type: string
          description: The description of this event.
        event_time:
          type: string
          format: date-time
          description: The timestamp when this event occurred.
        event_type:
          type: string
          description: The specific type identifier for this event.
        id:
          type: string
          description: The unique identifier for this event.
        resource:
          $ref: '#/components/schemas/EventResource'
          description: The resource associated with this event.
        type:
          type: string
      required:
      - type
    ThreatPolicy:
      type: object
      properties:
        category:
          type: string
          description: The category of this policy.
          enum:
          - PROCESS_EXECUTION
        display_name:
          type: string
          description: The display name for this policy.
        enabled:
          type: boolean
          description: Indicates whether this policy is currently enabled.
        id:
          type: string
          description: The unique identifier for this policy.
        managed_by:
          type: string
          description: The entity responsible for managing this policy.
          enum:
          - UPWIND
        open_issues:
          type: integer
          format: int32
          description: The number of open issues associated with this policy.
        scope:
          type: string
          description: Specifies whether the policy applies to all resources or a subset.
          enum:
          - ALL_RESOURCES
          - SUBSET
        severity:
          type: string
          description: The severity level of a threat as assessed by this policy.
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
    ApiCreatePolicyRulesRequest:
      type: object
      description: A bulk policy rule create request object.
      properties:
        policy_rules:
          type: array
          description: The list of policy rules to create.
          items:
            $ref: '#/components/schemas/ApiCreatePolicyRuleItem'
          maxItems: 100
          minItems: 1
      required:
      - policy_rules
    ApiLabelScopeCondition:
      allOf:
      - $ref: '#/components/schemas/ApiScopeCondition'
      - type: object
        properties:
          field:
            type: string
            description: The field to match against.
            minLength: 1
          operator:
            type: string
            description: The match operator.
            enum:
            - equals
            - not_equals
            - in
            - not_in
            minLength: 1
          value:
            type: array
            description: The values to match against.
            items:
              type: string
            minItems: 1
      description: A condition that matches resources by label.
      required:
      - field
      - operator
      - value
    ApiEditPolicyMetadata:
      type: object
      description: Partial display detection metadata for editing a policy.
      properties:
        detection_description:
          type: string
          description: The new detection description of this policy.
          example: Surfaces role or permission changes that grant elevated access.
        detection_title:
          type: string
          description: The new detection title of this policy.
          example: Privilege Escalation Attempt
    ApiEditRuleDefinitionsRequest:
      type: object
      description: A bulk threat rule definition edit request object.
      properties:
        rule_definitions:
          type: array
          description: The list of rule definitions to edit. If any item is not found or fails validation, no updates are applied.
          items:
            $ref: '#/components/schemas/ApiEditRuleDefinition'
          maxItems: 100
          minItems: 1
      required:
      - rule_definitions
    DetectionAwsCloudtrailInitiatorDetails:
      type: object
      properties:
        accessKeyId:
          type: string
        accountId:
          type: string
        arn:
          type: string
